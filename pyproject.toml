[project]
name = "airline-robustness"
version = "0.1.0"
requires-python = ">=3.10"
description = "Graph-theoretic toolkit for analyzing airline network robustness"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "outputs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = ["E501"]  # Long lines are handled by the formatter where possible.

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-config --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
